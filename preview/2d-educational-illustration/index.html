<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cẩm nang phòng cháy chữa cháy trong gia đình · Preview</title><style>:root{font-family:Arial,"Be Vietnam Pro",sans-serif;color:#251d26;background:#eee7e6}*{box-sizing:border-box}body{margin:0}.shell{width:min(1500px,100%);margin:auto;background:#fff;min-height:100vh;box-shadow:0 0 28px #0002}.top{padding:18px 24px;background:#fff;border-bottom:6px solid #e8979b}.top small{color:#9b3936;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.top h1{font-size:clamp(22px,3vw,42px);line-height:1.12;margin:5px 0 0;color:#df4b3b}.stage{background:#e8a6a7;aspect-ratio:16/9;width:100%;display:grid;place-items:center;overflow:hidden}.stage img{width:100%;height:100%;object-fit:contain;display:block}.meta{padding:16px 24px 22px}.meta p{font-size:clamp(16px,1.45vw,21px);line-height:1.5;margin:10px 0}.meta .label{font-weight:900;color:#8a383d}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px;background:#fff5d5;border-top:2px solid #e1bdb6}.controls button,.nav button{cursor:pointer;border:2px solid #29232a;border-radius:6px;padding:9px 14px;font-weight:800;background:#fff;color:#29232a}.controls button.primary,.nav button[aria-current=true]{background:#e64b3d;color:#fff}.controls input[type=range]{flex:1;min-width:160px;accent-color:#e64b3d}.controls output{font-variant-numeric:tabular-nums;font-weight:800;min-width:110px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:18px 24px}.nav button{text-align:left;font-size:13px;min-height:64px}.nav button strong{display:block;font-size:18px}.audio-direct{padding:0 24px 24px;width:100%}.audio-direct audio{width:min(700px,100%)}#status{color:#a32927;padding:0 24px}@media(max-width:720px){.nav{grid-template-columns:repeat(2,1fr)}.meta,.controls,.top{padding-left:14px;padding-right:14px}}.stage{position:relative;container-type:inline-size}.art-label{position:absolute;white-space:pre-line;line-height:1.18;font-weight:800;pointer-events:none;text-wrap:balance}#labels{position:absolute;inset:0;pointer-events:none}.stage{position:relative;overflow:hidden;width:min(100%,1280px,128dvh);margin-inline:auto}.stage img{position:absolute;inset:0;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;transition:none}.scene-caption{position:absolute;left:2%;bottom:2.5%;z-index:5;background:#fff8e9e8;border:2px solid #29232a;border-radius:9px;padding:.55em .8em;max-width:94%;font-size:clamp(15px,2cqw,31px);font-weight:800;line-height:1.2;pointer-events:none}.scene-caption[hidden]{display:none}.stage .art-label[hidden]{display:none}</style><style>#art{max-width:none!important;max-height:none!important}</style></head><body><main class="shell"><header class="top"><h1 id="title"></h1></header><div class="stage"><img id="art" alt="" width="1672" height="940"><div id="scene-caption" class="scene-caption" aria-live="polite"></div><div id="labels"></div></div><section class="meta"><p><span class="label">Lời đọc:</span> <span id="transcript"></span></p></section><div class="controls"><button id="back" type="button" aria-label="Phase trước">◀</button><button class="primary" id="play" type="button">Phát</button><button id="next" type="button" aria-label="Phase tiếp">▶</button><input id="timeline" type="range" min="0" max="239.33333333333331" step="0.01" value="0" aria-label="Tua toàn bộ preview"><output id="clock"></output></div><div id="status" role="status"></div><nav class="nav" id="nav" aria-label="Chọn phase"></nav><audio id="voice" preload="metadata"></audio></main><script type="application/json" id="data">{"title":"Cẩm nang phòng cháy chữa cháy trong gia đình","total_duration":239.33333333333331,"phases":[{"id":1,"name":"Quy trình xử lý khi xảy ra cháy","source_page":12,"duration":25.066666666666666,"voiceover":"Khi phát hiện cháy, hãy nhanh chóng hô hoán, đánh kẻng hoặc ấn chuông báo cháy để cảnh báo mọi người xung quanh. Gọi ngay cho lực lượng Cảnh sát Phòng cháy chữa cháy và Cứu nạn cứu hộ theo số điện thoại 114. Ngắt nguồn điện tại khu vực xảy ra cháy nếu có thể thực hiện an toàn. Sử dụng các phương tiện chữa cháy ban đầu phù hợp khi đám cháy còn nhỏ và có lối thoát an toàn. Nếu đám cháy phát triển mạnh, hãy nhanh chóng thoát nạn.","art":"assets/phase-1-art.png","labels":[],"audio":{"src":"assets/phase-1-vi.mp3","duration":24.555102040816326,"pending":false},"shots":[{"at":0,"x":0,"y":0.1,"size":0.48,"rect":[0,0.2,0.49,0.32],"caption":"1 · Báo động cho mọi người"},{"at":6.56,"x":0.52,"y":0.52,"size":0.48,"rect":[0.51,0.58,0.49,0.36],"caption":"4 · Gọi 114 ngay"},{"at":12.44,"x":0.52,"y":0.1,"size":0.48,"rect":[0.51,0.2,0.49,0.32],"caption":"2 · Ngắt điện nếu có thể tiếp cận an toàn"},{"at":16.32,"x":0,"y":0.52,"size":0.48,"rect":[0,0.58,0.49,0.36],"caption":"3 · Chữa cháy ban đầu khi còn an toàn"},{"at":21.68,"x":0,"y":0,"size":1,"rect":[0,0,1,1],"caption":"Bốn bước xử lý khi xảy ra cháy"}]},{"id":2,"name":"Hướng dẫn sử dụng bình chữa cháy","source_page":13,"duration":26,"voiceover":"Để sử dụng bình chữa cháy, trước tiên hãy di chuyển bình đến vị trí an toàn gần đám cháy. Tiếp theo, rút chốt an toàn, hướng vòi phun vào gốc lửa và bóp van để phun chất chữa cháy. Di chuyển vòi phun qua lại cho đến khi ngọn lửa được dập tắt. Đối với bình bột, thực hiện lắc bình theo hướng dẫn của nhà sản xuất. Khi sử dụng bình khí CO₂, cần tránh tiếp xúc trực tiếp với phần loa phun không có cách nhiệt để đề phòng bỏng lạnh.","art":"assets/phase-2-art.png","labels":[],"audio":{"src":"assets/phase-2-vi.mp3","duration":25.49551020408188,"pending":false},"shots":[{"at":0,"x":0,"y":0.12,"size":0.48,"rect":[0,0.13,0.36,0.59],"caption":"Di chuyển bình tới vị trí an toàn"},{"at":6.5,"x":0.27,"y":0.38,"size":0.46,"rect":[0.28,0.46,0.25,0.48],"caption":"Rút chốt an toàn"},{"at":11.96,"x":0.52,"y":0.25,"size":0.48,"rect":[0.51,0.25,0.49,0.7],"caption":"Hướng vòi vào gốc lửa và bóp van"},{"at":20.28,"x":0.64,"y":0.03,"size":0.36,"rect":[0.69,0.12,0.31,0.27],"caption":"Chọn và dùng đúng loại bình"},{"at":23.66,"x":0,"y":0,"size":1,"rect":[0,0,1,1],"caption":"Các bước dùng bình chữa cháy"}]},{"id":3,"name":"Bố trí lối thoát nạn tại ban công","source_page":14,"duration":23.3,"voiceover":"Để bảo đảm an toàn khi xảy ra cháy, các gia đình không nên lắp đặt chuồng cọp hoặc khung sắt bao kín ban công, cửa sổ. Những kết cấu này có thể cản trở quá trình thoát nạn và cứu hộ. Trong trường hợp cần thiết phải lắp đặt, cần bố trí ô cửa thoát hiểm có thể mở nhanh từ bên trong. Việc chuẩn bị lối thoát nạn phù hợp sẽ giúp các thành viên trong gia đình có thêm cơ hội thoát khỏi khu vực nguy hiểm.","art":"assets/phase-3-art.png","labels":[{"text":"KHÔNG NÊN LẮP ĐẶT “CHUỒNG CỌP”.\nTRƯỜNG HỢP CẦN THIẾT, NÊN BỐ TRÍ Ô CỬA.","x":46,"y":4,"w":50,"size":1.65,"color":"#29232a"}],"audio":{"src":"assets/phase-3-vi.mp3","duration":22.778775510204298,"pending":false},"shots":[{"at":0,"x":0,"y":0,"size":1,"rect":[0,0,1,1],"caption":"Ô cửa thoát hiểm trên khung sắt ban công"}]},{"id":4,"name":"Xây dựng phương án thoát nạn trong gia đình","source_page":15,"duration":23.7,"voiceover":"Mỗi gia đình cần chủ động xây dựng phương án thoát nạn khi xảy ra cháy và chia sẻ cho tất cả các thành viên được biết. Hãy xác định trước các lối thoát qua cửa chính, cửa phụ, ban công hoặc những lối thoát hiểm khác đã được chuẩn bị an toàn. Các thành viên cần nắm rõ vị trí và cách sử dụng phương tiện thoát nạn. Việc chuẩn bị và luyện tập từ trước sẽ giúp mọi người bình tĩnh, chủ động xử lý khi có sự cố xảy ra.","art":"assets/phase-4-art.png","labels":[{"text":"TÌM LỐI THOÁT QUA\nCỬA CHÍNH, BAN CÔNG\nHOẶC LỐI AN TOÀN\nĐÃ CHUẨN BỊ","x":31,"y":23,"w":18,"size":1.35,"color":"#fff"}],"audio":{"src":"assets/phase-4-vi.mp3","duration":23.196734693877772,"pending":false},"shots":[{"at":0,"x":0.18,"y":0.37,"size":0.57,"rect":[0.2,0.36,0.8,0.6],"caption":"Cùng gia đình xác định lối thoát"},{"at":7.3469999999999995,"x":0,"y":0.17,"size":0.53,"rect":[0.05,0.19,0.3,0.57],"caption":"Lối thoát qua ban công"},{"at":13.035,"x":0.48,"y":0.11,"size":0.52,"rect":[0.51,0.12,0.38,0.43],"caption":"Lối thoát đã chuẩn bị ở tầng trên"},{"at":18.012,"x":0.48,"y":0.48,"size":0.52,"rect":[0.49,0.52,0.34,0.39],"caption":"Lối thoát qua ô mở trên mái"},{"at":21.33,"x":0,"y":0,"size":1,"rect":[0,0,1,1],"caption":"Chia sẻ và luyện tập phương án thoát nạn"}]},{"id":5,"name":"Bảo đảm an toàn cho trẻ em tại nhà","source_page":16,"duration":30.6,"voiceover":"Trẻ em thường hiếu động, tò mò và chưa nhận thức đầy đủ về những nguy hiểm có thể xảy ra trong sinh hoạt hằng ngày. Vì vậy, các gia đình cần hạn chế để trẻ em ở nhà một mình, đặc biệt là trẻ nhỏ. Không để trẻ tự ý tiếp xúc với bếp gas, nguồn lửa, nguồn nhiệt hoặc các thiết bị có nguy cơ gây cháy. Đồng thời, không để trẻ chơi đùa tại khu vực cửa sổ, ban công hoặc leo trèo lên những vị trí nguy hiểm. Người lớn cần thường xuyên giám sát và hướng dẫn trẻ các kỹ năng an toàn cần thiết.","art":"assets/phase-5-art.png","labels":[],"audio":{"src":"assets/phase-5-vi.mp3","duration":30.066938775510508,"pending":false},"shots":[{"at":0,"x":0,"y":0.13,"size":0.5,"rect":[0,0.13,0.46,0.83],"caption":"Không để trẻ tiếp xúc với bếp và nguồn nhiệt"},{"at":15.912,"x":0.5,"y":0.13,"size":0.5,"rect":[0.45,0.13,0.55,0.83],"caption":"Không để trẻ chơi ở ban công, cửa sổ"},{"at":27.540000000000003,"x":0,"y":0,"size":1,"rect":[0,0,1,1],"caption":"Người lớn cần giám sát trẻ"}]},{"id":6,"name":"Kỹ năng thoát khỏi khói và xử lý khi quần áo bén lửa","source_page":17,"duration":29.466666666666665,"voiceover":"Khi thoát nạn trong môi trường có khói, hãy cúi thấp người và di chuyển về phía lối thoát an toàn. Có thể sử dụng khăn che mũi và miệng, nhưng cần lưu ý rằng khăn ướt không thể bảo vệ bạn khỏi các loại khí độc trong đám cháy. Không cố vượt qua khu vực có lửa hoặc khói dày đặc. Nếu quần áo bị bén lửa, tuyệt đối không chạy vì có thể khiến ngọn lửa bùng phát mạnh hơn. Hãy ngừng di chuyển, nằm xuống, dùng tay che mặt và lăn qua lăn lại cho đến khi ngọn lửa được dập tắt.","art":"assets/phase-6-art.png","labels":[{"text":"KHI PHẢI BĂNG QUA KHÓI,\nCÚI THẤP NGƯỜI, CHE MŨI MIỆNG\nVÀ TÌM LỐI THOÁT AN TOÀN.","x":5,"y":10,"w":43,"size":1.65,"color":"#29232a"},{"text":"KHI QUẦN ÁO BÉN LỬA:\nDỪNG LẠI · NẰM XUỐNG · LĂN","x":5,"y":37,"w":42,"size":1.78,"color":"#29232a"}],"audio":{"src":"assets/phase-6-vi.mp3","duration":28.943673469388045,"pending":false},"shots":[{"at":0,"x":0.5,"y":0,"size":0.5,"rect":[0.51,0.03,0.48,0.49],"caption":"Cúi thấp và che mũi miệng khi thoát qua khói"},{"at":13.849333333333332,"x":0,"y":0.5,"size":0.5,"rect":[0.01,0.55,0.3,0.41],"caption":"Ngừng di chuyển"},{"at":18.269333333333332,"x":0.25,"y":0.5,"size":0.5,"rect":[0.33,0.55,0.31,0.41],"caption":"Nằm xuống và che mặt"},{"at":22.983999999999998,"x":0.5,"y":0.5,"size":0.5,"rect":[0.65,0.55,0.34,0.41],"caption":"Lăn qua lăn lại cho đến khi lửa tắt"},{"at":27.109333333333332,"x":0,"y":0,"size":1,"rect":[0,0,1,1],"caption":"Thoát khói và xử lý khi quần áo bén lửa"}]},{"id":7,"name":"Những lưu ý khi tìm đường thoát nạn","source_page":18,"duration":29.766666666666666,"voiceover":"Khi xảy ra cháy, không nên hoảng loạn và tìm cách ẩn nấp dưới gầm giường, trong tủ quần áo hoặc những khu vực kín khó được phát hiện. Trước khi mở cửa để thoát nạn, hãy sử dụng mu bàn tay để kiểm tra nhiệt độ của cửa. Nếu cửa nóng hoặc có khói tràn qua khe cửa, không được mở và cần tìm phương án thoát nạn khác. Nếu điều kiện cho phép mở cửa, hãy đứng tránh sang một bên, từ từ hé cửa để kiểm tra. Khi phát hiện lửa hoặc khói dày đặc phía bên ngoài, cần nhanh chóng đóng cửa lại.","art":"assets/phase-7-art.png","labels":[],"audio":{"src":"assets/phase-7-vi.mp3","duration":29.25714285714315,"pending":false},"shots":[{"at":0,"x":0,"y":0,"size":0.55,"rect":[0,0.07,0.53,0.92],"caption":"Không trốn dưới gầm giường hoặc trong tủ"},{"at":13.097333333333333,"x":0.5,"y":0,"size":0.5,"rect":[0.54,0.07,0.45,0.4],"caption":"Dùng mu bàn tay kiểm tra nhiệt độ cửa"},{"at":21.432,"x":0.5,"y":0.5,"size":0.5,"rect":[0.54,0.5,0.45,0.49],"caption":"Đứng tránh sang bên khi kiểm tra lối ra"},{"at":27.087666666666667,"x":0,"y":0,"size":1,"rect":[0,0,1,1],"caption":"Kiểm tra cửa trước khi thoát nạn"}]},{"id":8,"name":"Hướng dẫn thoát nạn tại chung cư","source_page":19,"duration":27.433333333333334,"voiceover":"Khi xảy ra cháy tại chung cư, hãy giữ bình tĩnh, nhanh chóng xác định vị trí đám cháy và tìm lối thoát nạn an toàn. Di chuyển theo hành lang và các biển chỉ dẫn EXIT để đến cầu thang thoát hiểm. Trong môi trường có khói, cần cúi thấp người để hạn chế hít phải khói. Tuyệt đối không sử dụng thang máy thông thường khi xảy ra cháy, vì thang máy có thể mất điện, ngừng hoạt động hoặc trở thành khu vực nguy hiểm. Hãy sử dụng cầu thang thoát hiểm nếu lối đi còn bảo đảm an toàn.","art":"assets/phase-8-art.png","labels":[],"audio":{"src":"assets/phase-8-vi.mp3","duration":26.93224489795945,"pending":false},"shots":[{"at":0,"x":0,"y":0,"size":0.62,"rect":[0,0,0.66,1],"caption":"Cúi thấp và tìm lối thoát khỏi căn hộ"},{"at":15.088333333333335,"x":0.58,"y":0,"size":0.42,"rect":[0.66,0,0.34,0.45],"caption":"Đi theo chỉ dẫn EXIT tới cầu thang"},{"at":21.398,"x":0.58,"y":0.55,"size":0.42,"rect":[0.66,0.46,0.34,0.54],"caption":"Không sử dụng thang máy thông thường"},{"at":24.964333333333336,"x":0,"y":0,"size":1,"rect":[0,0,1,1],"caption":"Thoát nạn tại chung cư"}]},{"id":9,"name":"Xử lý khi không thể thoát ra ngoài tại chung cư","source_page":20,"duration":12,"voiceover":"Nếu không thể thoát ra ngoài do hành lang hoặc cầu thang đã bị lửa và khói bao phủ, hãy tìm khu vực an toàn, đóng kín cửa để hạn chế khói xâm nhập. Có thể sử dụng khăn, vải thấm nước hoặc băng dính để chèn bịt các khe cửa. Nhanh chóng gọi điện đến số 114, thông báo địa chỉ, số tầng, số căn hộ và số người đang mắc kẹt. Nếu ban công hoặc cửa sổ còn an toàn, hãy sử dụng khăn sáng màu, đèn pin hoặc hô to để phát tín hiệu cầu cứu. Tuyệt đối không tự ý nhảy từ trên cao xuống. Hãy giữ liên lạc và thực hiện theo hướng dẫn của lực lượng cứu hộ.","art":"assets/phase-9-art.png","labels":[{"text":"NẾU KHÔNG THỂ THOÁT RA NGOÀI:\nĐÓNG KÍN CỬA, CHÈN KHE BẰNG KHĂN ƯỚT.\nGỌI 114 VÀ PHÁT TÍN HIỆU TỪ BAN CÔNG AN TOÀN.","x":3,"y":5,"w":62,"size":1.65,"color":"#fff"},{"text":"KHÔNG TỰ Ý NHẢY TỪ TRÊN CAO.\nGIỮ LIÊN LẠC VÀ LÀM THEO HƯỚNG DẪN CỦA LỰC LƯỢNG CỨU HỘ.","x":56,"y":83,"w":40,"size":1.35,"color":"#29232a"}],"audio":{"src":null,"duration":0,"pending":true},"shots":[{"at":0,"x":0,"y":0.25,"size":0.56,"rect":[0,0.25,0.38,0.75],"caption":"Đóng cửa và chèn kín khe để hạn chế khói"},{"at":5.04,"x":0.44,"y":0,"size":0.56,"rect":[0.4,0,0.6,0.38],"caption":"Phát tín hiệu cầu cứu từ ban công an toàn"},{"at":9.600000000000001,"x":0,"y":0,"size":1,"rect":[0,0,1,1],"caption":"Gọi 114 và giữ liên lạc với lực lượng cứu hộ"}]},{"id":10,"name":"Hướng dẫn xử lý khi mắc kẹt trong thang máy","source_page":21,"duration":12,"voiceover":"Khi bị mắc kẹt trong thang máy, điều quan trọng nhất là giữ bình tĩnh và không hoảng loạn. Hãy ấn nút chuông báo động hoặc sử dụng hệ thống liên lạc khẩn cấp bên trong cabin để yêu cầu hỗ trợ. Sử dụng điện thoại liên hệ với ban quản lý tòa nhà, đơn vị cứu hộ thang máy hoặc gọi số 114 khi cần cứu nạn khẩn cấp. Tuyệt đối không tự ý cạy mở cửa, nhảy mạnh trên sàn hoặc trèo lên nóc thang máy. Hãy kiên nhẫn chờ đợi và thực hiện theo hướng dẫn của lực lượng cứu hộ để được đưa ra ngoài an toàn.","art":"assets/phase-10-art.png","labels":[{"text":"NÊN:\n• GIỮ BÌNH TĨNH\n• ẤN CHUÔNG BÁO ĐỘNG\n• LIÊN HỆ CỨU HỘ","x":71,"y":12,"w":27,"size":1.8,"color":"#29232a"},{"text":"KHÔNG NÊN:\n• TỰ CẠY MỞ CỬA\n• NHẢY TRÊN SÀN\n• TRÈO LÊN NÓC THANG","x":71,"y":57,"w":27,"size":1.8,"color":"#29232a"}],"audio":{"src":null,"duration":0,"pending":true},"shots":[{"at":0,"x":0,"y":0.03,"size":0.57,"rect":[0,0,0.61,1],"caption":"Giữ bình tĩnh, gọi trợ giúp và ấn chuông báo động"},{"at":4.5600000000000005,"x":0.58,"y":0,"size":0.42,"rect":[0.61,0.06,0.39,0.38],"caption":"Những việc nên làm"},{"at":8.16,"x":0.58,"y":0.55,"size":0.42,"rect":[0.61,0.52,0.39,0.4],"caption":"Những việc không nên làm"},{"at":10.8,"x":0,"y":0,"size":1,"rect":[0,0,1,1],"caption":"Chờ lực lượng cứu hộ hướng dẫn"}]}]}</script><script>
const data=JSON.parse(document.getElementById('data').textContent),phases=data.phases;
const art=document.getElementById('art'),voice=document.getElementById('voice'),range=document.getElementById('timeline'),play=document.getElementById('play'),nav=document.getElementById('nav'),caption=document.getElementById('scene-caption'),labels=document.getElementById('labels');
let index=0,local=0,playing=false,last=performance.now(),delay=0,seekAfterLoad=null,labelNodes=[];
const startOf=i=>phases.slice(0,i).reduce((sum,p)=>sum+p.duration,0);
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function showClock(){const t=startOf(index)+local;range.value=t;document.getElementById('clock').textContent=fmt(t)+' / '+fmt(data.total_duration)}
function showLabels(p){labels.replaceChildren();labelNodes=p.labels.map(spec=>{const node=document.createElement('div');node.className='art-label';node.textContent=spec.text;Object.assign(node.style,{left:spec.x+'%',top:spec.y+'%',width:spec.w+'%',fontSize:spec.size+'cqw',color:spec.color});labels.appendChild(node);return node})}
function paint(p,t){const shot=[...p.shots].reverse().find(s=>t>=s.at)||p.shots[0];caption.textContent=shot.caption;caption.hidden=!shot.caption}
function failed(){playing=false;play.textContent='Phát';document.getElementById('status').textContent='Không phát được MP3 thuyết minh.'}
function choose(i,t=0,auto=false){clearTimeout(delay);voice.pause();index=Math.max(0,Math.min(i,phases.length-1));const p=phases[index];local=Math.max(0,Math.min(t,p.duration));document.getElementById('title').textContent=p.name;document.getElementById('transcript').textContent=p.voiceover;art.src=p.art;art.alt='Minh họa '+p.name+' theo bố cục trang '+p.source_page;showLabels(p);paint(p,local);if(p.audio.src){seekAfterLoad=Math.min(local,p.audio.duration);voice.src=p.audio.src;voice.load()}else{seekAfterLoad=null;voice.removeAttribute('src');voice.load()}playing=auto;play.textContent=playing?'Tạm dừng':'Phát';document.getElementById('status').textContent=p.audio.src?'':'Phase này chưa có audio; các cảnh vẫn trình chiếu.';nav.querySelectorAll('button').forEach((b,n)=>b.setAttribute('aria-current',n===index?'true':'false'));showClock();last=performance.now();if(auto&&p.audio.src)void voice.play().catch(failed)}
phases.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML='<strong>'+p.id+'</strong>'+p.name;b.addEventListener('click',()=>choose(i));nav.appendChild(b)});
voice.addEventListener('loadedmetadata',()=>{if(seekAfterLoad!==null){voice.currentTime=seekAfterLoad;seekAfterLoad=null}});
voice.addEventListener('timeupdate',()=>{if(!phases[index].audio.src)return;local=voice.currentTime;paint(phases[index],local);showClock()});
voice.addEventListener('ended',()=>{if(!playing)return;local=phases[index].duration;paint(phases[index],local);showClock();delay=setTimeout(()=>{if(index<phases.length-1)choose(index+1,0,true);else{playing=false;play.textContent='Phát'}},500)});
voice.addEventListener('error',()=>{if(phases[index].audio.src)failed()});
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing&&!phases[index].audio.src){local+=dt;if(local>=phases[index].duration){if(index<phases.length-1)choose(index+1,0,true);else{local=phases[index].duration;playing=false;play.textContent='Phát'}}paint(phases[index],local);showClock()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
play.addEventListener('click',()=>{if(playing){playing=false;voice.pause();clearTimeout(delay);play.textContent='Phát'}else{if(local>=phases[index].duration)choose(index,0,false);playing=true;play.textContent='Tạm dừng';last=performance.now();if(phases[index].audio.src)void voice.play().catch(failed)}});
document.getElementById('back').addEventListener('click',()=>choose(index-1));document.getElementById('next').addEventListener('click',()=>choose(index+1));
range.addEventListener('input',()=>window.renderAt(Number(range.value)));
window.renderAt=function(t){let remaining=Math.max(0,Math.min(Number(t)||0,data.total_duration));let i=0;while(i<phases.length-1&&remaining>=phases[i].duration){remaining-=phases[i].duration;i++}choose(i,remaining,false)};
choose(0);window.previewReady=art.decode().then(()=>true);
</script><script>/* panel-crop-override */function panelPaint(phase,time){
 const shot=[...phase.shots].reverse().find(s=>time>=s.at)||phase.shots[0];
 const r=shot.rect||[shot.x,shot.y,shot.size,shot.size];
 const z=Math.min(1/r[2],1/r[3]);
 art.style.width=100*z+'%';art.style.height=100*z+'%';
 art.style.left=100*(.5-(r[0]+r[2]/2)*z)+'%';
 art.style.top=100*(.5-(r[1]+r[3]/2)*z)+'%';
 art.style.clipPath=shot.size===1?'none':'inset('+(r[1]*100)+'% '+((1-r[0]-r[2])*100)+'% '+((1-r[1]-r[3])*100)+'% '+(r[0]*100)+'%)';
 art.style.objectFit='fill';
 caption.textContent=shot.caption;caption.hidden=!shot.caption;
 document.querySelectorAll('.art-label').forEach(node=>node.hidden=shot.size!==1);
}paint=panelPaint;paint(phases[index],local);</script></body></html>
