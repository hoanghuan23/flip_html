<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario Animation — Phase 1</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="scene" aria-label="Nhân vật chạy và nhảy qua hai thùng gỗ">
    <img class="obstacle obstacle--first"
         src="../../environment/crate_single.png"
         alt="Chướng ngại vật 1: thùng gỗ" draggable="false">
    <img class="obstacle obstacle--second"
         src="../../environment/crate_single.png"
         alt="Chướng ngại vật 2: thùng gỗ" draggable="false">
    <div id="character" class="character">
      <img id="mario" src="../../characters/run_0.png"
           alt="Nhân vật đang chạy" draggable="false">
    </div>
  </main>

  <p id="status" class="status" role="status"></p>
</body>
</html>
