
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <img id="mario" src="../../characters/run_0.png" alt="Mario">
  </div>

  <div class="controls">
    <input id="timeline" type="range"
           min="0" max="5" step="0.01" value="0">
    <span id="time">0.00s</span>
    <button id="play">Play</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
