<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <g id="shared-scene">
  <rect id="full-background" x="0" y="0" width="1920" height="1080" fill="#1769AA" />
  <path id="shallow-water" d="M0 250 H1920 V795 H0 Z" fill="#5CC8E8" />
  <path id="shore" d="M0 770 Q480 750 960 770 T1920 770 V1080 H0 Z" fill="#F4D35E" />
</g>
<defs id="shared-character">
  <g id="swimmer-head"><circle cx="0" cy="-43" r="29" fill="#FF6B6B" /><circle cx="-9" cy="-48" r="3" fill="#17324D" /><circle cx="9" cy="-48" r="3" fill="#17324D" /></g>
  <g id="swimmer-torso"><ellipse cx="0" cy="28" rx="34" ry="55" fill="#FF6B6B" /></g>
  <g id="swimmer-arm-left"><rect x="-51" y="-8" width="18" height="85" rx="9" fill="#FF6B6B" /></g>
  <g id="swimmer-arm-right"><rect x="33" y="-8" width="18" height="85" rx="9" fill="#FF6B6B" /></g>
  <g id="swimmer-leg-left"><rect x="-23" y="73" width="18" height="75" rx="9" fill="#FF6B6B" /></g>
  <g id="swimmer-leg-right"><rect x="5" y="73" width="18" height="75" rx="9" fill="#FF6B6B" /></g>
</defs><style>
    @keyframes waves-drift {
      from { transform: translate(0px, 0px); }
      to { transform: translate(0px, 10px); }
    }

    @keyframes swimmer-horizontal {
      from { transform: translate(0px, 0px); }
      to { transform: translate(220px, 0px); }
    }

    @keyframes swimmer-shoreward {
      from { transform: translate(0px, 0px); }
      to { transform: translate(0px, 400px); }
    }

    @keyframes calm-head {
      from { transform: rotate(-8deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes calm-torso {
      from { transform: rotate(4deg) scale(0.97, 1.04); }
      to { transform: rotate(0deg) scale(1, 1); }
    }

    @keyframes calm-arm-left {
      from { transform: rotate(-36deg) scale(0.96, 1.04); }
      to { transform: rotate(0deg) scale(1, 1); }
    }

    @keyframes calm-arm-right {
      from { transform: rotate(34deg) scale(0.96, 1.05); }
      to { transform: rotate(0deg) scale(1, 1); }
    }

    @keyframes calm-leg-left {
      from { transform: rotate(-24deg) scale(0.98, 1.03); }
      to { transform: rotate(0deg) scale(1, 1); }
    }

    @keyframes calm-leg-right {
      from { transform: rotate(27deg) scale(0.98, 1.03); }
      to { transform: rotate(0deg) scale(1, 1); }
    }

    #waves {
      animation-name: waves-drift;
      animation-duration: 3.5s;
      animation-delay: 0s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      transform-box: fill-box;
      transform-origin: center;
    }

    #swimmer-horizontal,
    #swimmer-shoreward,
    #swimmer-head,
    #swimmer-torso,
    #swimmer-arm-left,
    #swimmer-arm-right,
    #swimmer-leg-left,
    #swimmer-leg-right {
      transform-box: fill-box;
      transform-origin: center;
      animation-fill-mode: both;
    }

    #swimmer-horizontal {
      animation-name: swimmer-horizontal;
      animation-duration: 0.45s;
      animation-delay: 0.8s;
      animation-timing-function: linear;
    }

    #swimmer-shoreward {
      animation-name: swimmer-shoreward;
      animation-duration: 0.75s;
      animation-delay: 1.25s;
      animation-timing-function: ease-in-out;
    }

    #swimmer-head,
    #swimmer-torso,
    #swimmer-arm-left,
    #swimmer-arm-right,
    #swimmer-leg-left,
    #swimmer-leg-right {
      animation-duration: 0.45s;
      animation-delay: 0.35s;
      animation-timing-function: ease-in-out;
    }

    #swimmer-head { animation-name: calm-head; }
    #swimmer-torso { animation-name: calm-torso; }
    #swimmer-arm-left { animation-name: calm-arm-left; }
    #swimmer-arm-right { animation-name: calm-arm-right; }
    #swimmer-leg-left { animation-name: calm-leg-left; }
    #swimmer-leg-right { animation-name: calm-leg-right; }
  </style>

  <g id="artwork">
    <text x="960" y="92" text-anchor="middle" fill="#17324D" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="48" font-weight="700">Bình tĩnh, bơi song song với bờ</text>

    <g id="waves" fill="none" stroke="#F5F2E8" stroke-width="18" stroke-linecap="round">
      <path d="M70 700 C260 680 440 720 620 700 S790 680 875 700" />
      <path d="M1045 700 C1130 680 1300 720 1480 700 S1730 680 1850 700" />
      <path d="M40 740 C220 720 400 760 590 740 S790 720 875 740" />
      <path d="M1045 740 C1230 720 1400 760 1580 740 S1770 720 1880 740" />
      <path d="M90 775 C260 755 430 795 610 775 S790 755 875 775" />
      <path d="M1045 775 C1210 755 1390 795 1570 775 S1750 755 1840 775" />
    </g>

    <g id="arrow" fill="none" stroke="#17324D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
      <path d="M960 610 V300" />
      <path d="M960 300 L938 328" />
      <path d="M960 300 L982 328" />
    </g>
  </g>

  <path id="rip-current" d="M885 780 C905 620 905 480 905 330 L925 175 H995 L1015 330 C1015 480 1015 620 1035 780 Z" fill="#1769AA" /><g id="swimmer">
    <g transform="translate(960 250)">
      <g id="swimmer-horizontal">
        <g id="swimmer-shoreward">
          <g id="swimmer-head">
            <use href="#swimmer-head" />
          </g>
          <g id="swimmer-torso">
            <use href="#swimmer-torso" />
          </g>
          <g id="swimmer-arm-left">
            <use href="#swimmer-arm-left" />
          </g>
          <g id="swimmer-arm-right">
            <use href="#swimmer-arm-right" />
          </g>
          <g id="swimmer-leg-left">
            <use href="#swimmer-leg-left" />
          </g>
          <g id="swimmer-leg-right">
            <use href="#swimmer-leg-right" />
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
