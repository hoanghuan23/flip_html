<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Phase 4 - Nguy hiểm: hoảng sợ và kiệt sức</title>
<style>html,body{margin:0;height:100%;background:#1769AA;overflow:hidden}svg{width:100%;height:100%;display:block}</style>
</head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <g id="shared-scene">
  <rect id="full-background" x="0" y="0" width="1920" height="1080" fill="#1769AA" />
  <path id="shallow-water" d="M0 250 H1920 V795 H0 Z" fill="#5CC8E8" />
  <path id="shore" d="M0 770 Q480 750 960 770 T1920 770 V1080 H0 Z" fill="#F4D35E" />
</g>
<defs id="shared-character">
  <g id="swimmer-head"><circle cx="0" cy="-43" r="29" fill="#FF6B6B" /><circle cx="-9" cy="-48" r="3" fill="#17324D" /><circle cx="9" cy="-48" r="3" fill="#17324D" /></g>
  <g id="swimmer-torso"><ellipse cx="0" cy="28" rx="34" ry="55" fill="#FF6B6B" /></g>
  <g id="swimmer-arm-left"><rect x="-51" y="-8" width="18" height="85" rx="9" fill="#FF6B6B" /></g>
  <g id="swimmer-arm-right"><rect x="33" y="-8" width="18" height="85" rx="9" fill="#FF6B6B" /></g>
  <g id="swimmer-leg-left"><rect x="-23" y="73" width="18" height="75" rx="9" fill="#FF6B6B" /></g>
  <g id="swimmer-leg-right"><rect x="5" y="73" width="18" height="75" rx="9" fill="#FF6B6B" /></g>
</defs><style>
    @keyframes phase4-pull {
      from { transform: translate(0px, 0px); }
      to { transform: translate(0px, -170px); }
    }

    @keyframes phase4-wave-drift {
      from { transform: translate(0px, 0px); }
      to { transform: translate(0px, 10px); }
    }

    @keyframes phase4-warning {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes phase4-head-panic {
      0% { transform: rotate(0deg); }
      55% { transform: rotate(-13deg); }
      100% { transform: rotate(-8deg); }
    }

    @keyframes phase4-torso-panic {
      0% { transform: rotate(0deg) scale(1, 1); }
      55% { transform: rotate(7deg) scale(0.94, 1.06); }
      100% { transform: rotate(4deg) scale(0.97, 1.04); }
    }

    @keyframes phase4-arm-left-panic {
      0% { transform: rotate(0deg) scale(1, 1); }
      55% { transform: rotate(-52deg) scale(0.9, 1.08); }
      100% { transform: rotate(-36deg) scale(0.96, 1.04); }
    }

    @keyframes phase4-arm-right-panic {
      0% { transform: rotate(0deg) scale(1, 1); }
      55% { transform: rotate(48deg) scale(0.9, 1.1); }
      100% { transform: rotate(34deg) scale(0.96, 1.05); }
    }

    @keyframes phase4-leg-left-panic {
      0% { transform: rotate(0deg) scale(1, 1); }
      55% { transform: rotate(-34deg) scale(0.94, 1.06); }
      100% { transform: rotate(-24deg) scale(0.98, 1.03); }
    }

    @keyframes phase4-leg-right-panic {
      0% { transform: rotate(0deg) scale(1, 1); }
      55% { transform: rotate(38deg) scale(0.93, 1.07); }
      100% { transform: rotate(27deg) scale(0.98, 1.03); }
    }

    #phase4-waves {
      animation-name: phase4-wave-drift;
      animation-duration: 3.5s;
      animation-delay: 0s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      transform-box: fill-box;
      transform-origin: center;
    }

    #phase4-swimmer-motion {
      animation-name: phase4-pull;
      animation-duration: 2s;
      animation-delay: 0s;
      animation-timing-function: linear;
      animation-fill-mode: both;
      transform-box: fill-box;
      transform-origin: center;
    }

    #phase4-warning {
      opacity: 0;
      animation-name: phase4-warning;
      animation-duration: 0.6s;
      animation-delay: 0.7s;
      animation-timing-function: ease-in-out;
      animation-fill-mode: both;
      transform-box: fill-box;
      transform-origin: center;
    }

    #phase4-head,
    #phase4-torso,
    #phase4-arm-left,
    #phase4-arm-right,
    #phase4-leg-left,
    #phase4-leg-right {
      transform-box: fill-box;
      transform-origin: center;
      animation-delay: 1.5s;
      animation-duration: 1.7s;
      animation-timing-function: ease-in-out;
      animation-fill-mode: both;
    }

    #phase4-head { animation-name: phase4-head-panic; }
    #phase4-torso { animation-name: phase4-torso-panic; }
    #phase4-arm-left { animation-name: phase4-arm-left-panic; }
    #phase4-arm-right { animation-name: phase4-arm-right-panic; }
    #phase4-leg-left { animation-name: phase4-leg-left-panic; }
    #phase4-leg-right { animation-name: phase4-leg-right-panic; }
  </style>

  <g id="artwork">
    <text x="960" y="92" text-anchor="middle" fill="#17324D" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="48" font-weight="700">Bơi ngược dòng dễ kiệt sức</text>

    <g id="phase4-waves" fill="none" stroke="#F5F2E8" stroke-width="18" stroke-linecap="round">
      <path d="M70 700 C260 680 440 720 620 700 S790 680 875 700" />
      <path d="M1045 700 C1130 680 1300 720 1480 700 S1730 680 1850 700" />
      <path d="M40 740 C220 720 400 760 590 740 S790 720 875 740" />
      <path d="M1045 740 C1230 720 1400 760 1580 740 S1770 720 1880 740" />
      <path d="M90 775 C260 755 430 795 610 775 S790 755 875 775" />
      <path d="M1045 775 C1210 755 1390 795 1570 775 S1750 755 1840 775" />
    </g>

    <g id="phase4-arrow" fill="none" stroke="#17324D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M960 610 V300" />
      <path d="M960 300 L930 338" />
      <path d="M960 300 L990 338" />
    </g>

    <g id="warning" transform="translate(1065 220)">
      <g id="phase4-warning">
        <circle cx="0" cy="0" r="35" fill="#F4A261" />
        <text x="0" y="18" text-anchor="middle" fill="#17324D" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="58" font-weight="700">!</text>
      </g>
    </g>
  </g>

  <path id="rip-current" d="M885 780 C905 620 905 480 905 330 L925 175 H995 L1015 330 C1015 480 1015 620 1035 780 Z" fill="#1769AA" /><g id="swimmer">
    <g transform="translate(960 420)">
      <g id="phase4-swimmer-motion">
        <g id="phase4-head">
          <use href="#swimmer-head" />
        </g>
        <g id="phase4-torso">
          <use href="#swimmer-torso" />
        </g>
        <g id="phase4-arm-left">
          <use href="#swimmer-arm-left" />
        </g>
        <g id="phase4-arm-right">
          <use href="#swimmer-arm-right" />
        </g>
        <g id="phase4-leg-left">
          <use href="#swimmer-leg-left" />
        </g>
        <g id="phase4-leg-right">
          <use href="#swimmer-leg-right" />
        </g>
      </g>
    </g>
  </g>
</svg>
<script>
var D=3.5;
function seek(t){document.getAnimations().forEach(function(a){a.pause();a.currentTime=t*1000})}
addEventListener("message",function(e){if(e.data&&typeof e.data.t==="number")seek(e.data.t)});
if(parent===window){var s=performance.now();(function f(n){seek(((n-s)/1000)%D);requestAnimationFrame(f)})(s)}else{seek(0)}
</script></body></html>
